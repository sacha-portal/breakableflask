name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - name: Dependances
        run: |
          docker run --rm -v "$PWD":/src aquasec/trivy:latest fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --file-patterns 'pip:.*requirements\.txt$' /src/requirements.txt
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - name: Test Dockerfile
        run: |
          docker build -t breakableflask:${{ github.sha }} .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --exit-code 1 breakableflask:${{ github.sha }}
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |

          echo "Rien à faire ici. Votre application est prête à être déployée"
